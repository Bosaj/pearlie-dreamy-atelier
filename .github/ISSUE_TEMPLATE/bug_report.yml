name: Bug Report
description: Report a visual, layout, or checkout issue on Pearlie Handcrafted × Little Calm Corner
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thank you for helping keep the Pearlie Handcrafted × Little Calm Corner Digital Maison flawless!
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the issue is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps To Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Open 'https://bosaj.github.io/pearlie-dreamy-atelier/'
        2. Click on '...'
        3. Scroll down to '...'
        4. See issue
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
